<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Git-Project-365 - Pages HTML</title>
  <style>
    :root {
      --accent:#087786; --accent-dark:#055864; --accent-soft:#e4f5f6;
      --green:#2f8f68; --bg:#edf3f5; --surface:#fff; --surface-2:#f7f9fa;
      --line:#d7e1e5; --text:#17272e; --muted:#697c84; --danger:#b4232b;
      --shadow:0 16px 42px rgba(23,39,46,.11); --radius:16px;
    }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { font-family:"Segoe UI",system-ui,-apple-system,sans-serif; color:var(--text); background:var(--bg); }
    button, input { font:inherit; }
    [hidden] { display:none !important; }

    .app { display:flex; width:100%; height:100dvh; min-height:0; }
    nav { position:relative; z-index:2; display:flex; flex:0 0 300px; min-width:240px; min-height:0; flex-direction:column; overflow:hidden; background:var(--surface); border-right:1px solid var(--line); box-shadow:8px 0 28px rgba(23,39,46,.06); }
    nav header { padding:23px 20px 21px; color:#fff; background:radial-gradient(circle at 100% 0,rgba(255,255,255,.2),transparent 40%),linear-gradient(135deg,var(--accent-dark),var(--green)); }
    nav h1 { display:flex; align-items:center; gap:10px; margin:0; font-size:18px; letter-spacing:-.01em; }
    nav header p { margin:7px 0 0; font-size:12px; opacity:.86; }

    .search { padding:14px; border-bottom:1px solid var(--line); }
    .search input { width:100%; height:42px; padding:0 13px; color:var(--text); background:var(--surface-2); border:1px solid var(--line); border-radius:11px; outline:none; transition:.18s ease; }
    .search input:hover { background:#fff; }
    .search input:focus { background:#fff; border-color:var(--accent); box-shadow:0 0 0 3px rgba(8,119,134,.13); }

    #menu { flex:1; min-height:0; overflow:auto; padding:10px 8px; scrollbar-width:thin; scrollbar-color:#bdcbd1 transparent; }
    .group { padding:13px 10px 6px; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .item { display:block; margin:2px 0; padding:10px 12px; overflow:hidden; color:var(--text); font-size:14px; line-height:1.35; text-decoration:none; text-overflow:ellipsis; white-space:nowrap; border:1px solid transparent; border-radius:10px; transition:.16s ease; }
    .item:hover { color:var(--accent-dark); background:var(--surface-2); border-color:var(--line); transform:translateX(2px); }
    .item.active { color:var(--accent-dark); font-weight:650; background:var(--accent-soft); border-color:#c5e5e8; }
    .msg { padding:18px 12px; color:var(--muted); font-size:13px; line-height:1.55; }
    .msg.err { color:var(--danger); }
    .msg code { padding:1px 5px; background:rgba(180,35,43,.08); border-radius:4px; }
    nav footer { padding:10px 16px; color:#82939b; font-size:11px; background:var(--surface-2); border-top:1px solid var(--line); }

    main { display:flex; flex:1; min-width:0; min-height:0; flex-direction:column; }
    .bar { display:flex; flex:0 0 auto; align-items:center; gap:8px; min-height:58px; padding:9px 14px; background:rgba(255,255,255,.94); border-bottom:1px solid var(--line); box-shadow:0 4px 16px rgba(23,39,46,.05); backdrop-filter:blur(10px); }
    .bar .title { flex:1; min-width:0; overflow:hidden; font-size:14px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
    .action { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:37px; padding:7px 11px; color:var(--accent-dark); font-size:13px; font-weight:600; text-decoration:none; background:#fff; border:1px solid var(--line); border-radius:10px; cursor:pointer; transition:.16s ease; }
    .action:hover { background:var(--accent-soft); border-color:#b7dfe3; transform:translateY(-1px); }
    .action.home { color:#fff; background:var(--accent); border-color:var(--accent); }
    .action.home:hover { background:var(--accent-dark); border-color:var(--accent-dark); }

    iframe { display:block; flex:1; width:100%; min-height:0; background:#fff; border:0; }
    .welcome { display:grid; flex:1; min-height:0; place-items:center; padding:24px; background:radial-gradient(circle at 70% 20%,rgba(8,119,134,.08),transparent 32%),var(--bg); }
    .welcome-card { width:min(530px,100%); padding:36px; text-align:center; background:rgba(255,255,255,.9); border:1px solid rgba(215,225,229,.95); border-radius:var(--radius); box-shadow:var(--shadow); }
    .welcome-icon { display:grid; width:60px; height:60px; margin:0 auto 17px; place-items:center; font-size:27px; background:var(--accent-soft); border-radius:18px; }
    .welcome strong { display:block; margin-bottom:7px; font-size:19px; }
    .welcome span { color:var(--muted); font-size:14px; line-height:1.55; }

    @media (max-width:760px) {
      nav { flex-basis:230px; min-width:190px; }
      nav header { padding:18px 15px; }
      .bar { min-height:54px; padding:8px 10px; }
      .action { padding:7px 9px; }
    }
    @media (max-width:560px) {
      .app { flex-direction:column; }
      nav { flex:0 0 auto; width:100%; min-width:0; max-height:45dvh; border-right:0; border-bottom:1px solid var(--line); }
      nav header { padding:14px 16px; }
      nav header p { display:none; }
      .search { padding:10px; }
      #menu { padding:6px; }
      .bar .label { display:none; }
      .welcome-card { padding:28px 20px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <nav aria-label="Pages HTML">
      <header>
        <h1><span aria-hidden="true">📚</span> Pages HTML</h1>
        <p>Cliquez sur une page pour la lancer</p>
      </header>
      <div class="search">
        <input id="filter" type="search" placeholder="Rechercher une page…" autocomplete="off" aria-label="Rechercher une page">
      </div>
      <div id="menu"><div class="msg">Chargement…</div></div>
      <footer id="count" aria-live="polite"></footer>
    </nav>

    <main>
      <div class="bar" id="bar" hidden>
        <span class="title" id="curTitle"></span>
        <button class="action home" id="home" type="button" title="Retour à l’accueil" aria-label="Retour à l’accueil"><span aria-hidden="true">⌂</span><span class="label">Accueil</span></button>
        <button class="action" id="reload" type="button" title="Recharger la page"><span aria-hidden="true">↻</span><span class="label">Recharger</span></button>
        <a class="action" id="openTab" target="_blank" rel="noopener" title="Ouvrir dans un nouvel onglet"><span aria-hidden="true">↗</span><span class="label">Nouvel onglet</span></a>
      </div>

      <div class="welcome" id="welcome">
        <div class="welcome-card">
          <div class="welcome-icon" aria-hidden="true">⌂</div>
          <strong>Bienvenue</strong>
          <span>Sélectionnez une page dans le menu pour l’afficher dans cet espace.</span>
        </div>
      </div>
      <iframe id="frame" hidden title="Page sélectionnée"></iframe>
    </main>
  </div>

  <script>
    (function () {
      'use strict';
      var FOLDER = 'PageHTML';
      var pages = [];
      var currentFile = null;
      var $menu = document.getElementById('menu');
      var $filter = document.getElementById('filter');
      var $frame = document.getElementById('frame');
      var $bar = document.getElementById('bar');
      var $welcome = document.getElementById('welcome');
      var $curTitle = document.getElementById('curTitle');
      var $openTab = document.getElementById('openTab');
      var $count = document.getElementById('count');

      function prettyName(file) {
        var base = file.split('/').pop().replace(/\.html?$/i, '');
        return base.replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
      }
      function encodePath(path) { return path.split('/').map(encodeURIComponent).join('/'); }
      function isHtml(name) { return /\.html?$/i.test(name) && !/^manifest/i.test(name); }
      function normalizePages(list) {
        return list.filter(function (page) { return page && typeof page.file === 'string' && isHtml(page.file); });
      }
      function fromManifest() {
        return fetch(FOLDER + '/manifest.json', { cache:'no-store' }).then(function (response) {
          if (!response.ok) throw new Error('manifest absent');
          return response.json();
        }).then(function (json) {
          var list = Array.isArray(json) ? json : (json.pages || []);
          return normalizePages(list.map(function (item) {
            return typeof item === 'string' ? { file:item, title:prettyName(item) } : { file:item.file, title:item.title || prettyName(item.file) };
          }));
        });
      }
      function fromGitHubApi() {
        var host = location.hostname;
        if (!/\.github\.io$/i.test(host)) return Promise.reject(new Error('pas sur github.io'));
        var owner = host.split('.')[0];
        var repo = location.pathname.split('/')[1];
        if (!repo) return Promise.reject(new Error('dépôt introuvable'));
        return fetch('https://api.github.com/repos/' + owner + '/' + repo + '/git/trees/HEAD?recursive=1').then(function (response) {
          if (!response.ok) throw new Error('API GitHub ' + response.status);
          return response.json();
        }).then(function (json) {
          return (json.tree || []).filter(function (item) {
            return item.type === 'blob' && item.path.indexOf(FOLDER + '/') === 0 && isHtml(item.path);
          }).map(function (item) {
            var file = item.path.substring(FOLDER.length + 1);
            return { file:file, title:prettyName(file) };
          });
        });
      }
      function fromDirectoryListing() {
        return fetch(FOLDER + '/').then(function (response) {
          if (!response.ok) throw new Error('listing indisponible');
          return response.text();
        }).then(function (html) {
          var doc = new DOMParser().parseFromString(html, 'text/html');
          var output = [];
          doc.querySelectorAll('a[href]').forEach(function (link) {
            var href = decodeURIComponent(link.getAttribute('href').split('?')[0]).replace(/^.*\//, '');
            if (isHtml(href)) output.push({ file:href, title:prettyName(href) });
          });
          if (!output.length) throw new Error('aucun fichier');
          return output;
        });
      }
      function load() { return fromManifest().catch(fromGitHubApi).catch(fromDirectoryListing); }

      function render() {
        var query = $filter.value.trim().toLowerCase();
        var list = pages.filter(function (page) {
          return !query || page.title.toLowerCase().indexOf(query) > -1 || page.file.toLowerCase().indexOf(query) > -1;
        });
        $menu.innerHTML = '';
        if (!list.length) {
          var message = document.createElement('div');
          message.className = 'msg';
          message.textContent = pages.length ? 'Aucun résultat.' : 'Aucune page trouvée.';
          $menu.appendChild(message);
        }
        var lastGroup = null;
        list.forEach(function (page) {
          var parts = page.file.split('/');
          var group = parts.length > 1 ? parts.slice(0,-1).join(' / ') : '';
          if (group !== lastGroup) {
            if (group) {
              var groupTitle = document.createElement('div');
              groupTitle.className = 'group';
              groupTitle.textContent = group;
              $menu.appendChild(groupTitle);
            }
            lastGroup = group;
          }
          var link = document.createElement('a');
          link.className = 'item';
          link.textContent = page.title;
          link.title = page.file;
          link.href = '#' + encodeURIComponent(page.file);
          link.dataset.file = page.file;
          if (page.file === currentFile) link.classList.add('active');
          $menu.appendChild(link);
        });
        $count.textContent = pages.length + ' page' + (pages.length > 1 ? 's' : '');
      }

      function openPage(file) {
        var page = pages.filter(function (item) { return item.file === file; })[0];
        if (!page) return;
        currentFile = file;
        var url = FOLDER + '/' + encodePath(file);
        $frame.src = url;
        $frame.hidden = false;
        $bar.hidden = false;
        $welcome.hidden = true;
        $curTitle.textContent = page.title;
        $openTab.href = url;
        document.title = page.title + ' - Git-Project-365';
        document.querySelectorAll('.item').forEach(function (element) {
          element.classList.toggle('active', element.dataset.file === file);
        });
      }

      function goHome() {
        currentFile = null;
        $frame.src = 'about:blank';
        $frame.hidden = true;
        $bar.hidden = true;
        $welcome.hidden = false;
        $curTitle.textContent = '';
        $openTab.removeAttribute('href');
        document.title = 'Git-Project-365 - Pages HTML';
        document.querySelectorAll('.item').forEach(function (element) { element.classList.remove('active'); });
        if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      }

      function openFromHash() {
        var hash = decodeURIComponent(location.hash.replace(/^#/, ''));
        if (hash) openPage(hash);
        else if (currentFile) goHome();
      }

      $filter.addEventListener('input', render);
      document.getElementById('home').addEventListener('click', goHome);
      document.getElementById('reload').addEventListener('click', function () { if (currentFile) $frame.src = $frame.src; });
      window.addEventListener('hashchange', openFromHash);

      load().then(function (list) {
        pages = normalizePages(list).sort(function (a,b) { return a.file.localeCompare(b.file, 'fr', { numeric:true }); });
        render();
        openFromHash();
      }).catch(function () {
        $menu.innerHTML = '';
        var message = document.createElement('div');
        message.className = 'msg err';
        message.innerHTML = 'Impossible de lister les pages.<br>Générez <code>PageHTML/manifest.json</code> avec <code>generate-manifest.ps1</code>, puis ouvrez la page via GitHub Pages ou un serveur local, et non en double-clic <code>file://</code>.';
        $menu.appendChild(message);
        $count.textContent = 'Chargement impossible';
      });
    })();
  </script>
</body>
</html>
